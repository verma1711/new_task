services:
  backend:
    build:
      context: ./api
    container_name: backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_BASE_URL: /api
    depends_on:
      - backend
    restart: unless-stopped